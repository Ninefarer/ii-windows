name: Shell patches

on:
  pull_request:
    paths:
      - 'patches/ii/**'
      - 'tools/apply-ii-patches.py'
      - 'tools/test-ii-patches.py'
      - 'sources.lock'
      - '.github/workflows/shell-patches.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check out the locked shell
        run: |
          git config --global core.autocrlf false
          read -r name url sha < <(grep '^ii ' sources.lock)
          git init -q ii
          git -C ii fetch -q --depth 1 "$url" "$sha"
          git -C ii checkout -q FETCH_HEAD
      - name: Test patch application and packaging inputs
        run: python tools/test-ii-patches.py ii
