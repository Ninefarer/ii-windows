name: Single EXE preview installer
on:
  push:
    branches: [windows-native-end4]
    paths: [packaging/**, .github/workflows/offline-installer.yml]
  workflow_dispatch:
    inputs:
      candidate_run:
        description: Successful Windows native candidate run ID
        required: true
      publish_release:
        description: Publish the validated EXE as a GitHub prerelease
        type: boolean
        default: false
permissions:
  actions: read
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_RUN: ${{ inputs.candidate_run }}
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the candidate including runtime smoke tests
        timeout-minutes: 45
        run: |
          if [ -z "$CANDIDATE_RUN" ]; then
            CANDIDATE_RUN=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/native-candidate.yml/runs?branch=windows-native-end4&per_page=1" --jq '.workflow_runs[0].id')
          fi
          echo "CANDIDATE_RUN=$CANDIDATE_RUN" >> "$GITHUB_ENV"
          while true; do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN" > candidate.json
            status=$(python -c 'import json; print(json.load(open("candidate.json"))["status"])')
            [ "$status" = completed ] && break
            echo "Waiting for candidate $CANDIDATE_RUN ($status)"
            sleep 30
          done
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN" > candidate.json
          python - <<'PY'
          import json, os
          run = json.load(open('candidate.json'))
          assert run['name'] == 'Windows native candidate'
          assert run['head_branch'] == 'windows-native-end4'
          assert run['status'] == 'completed' and run['conclusion'] == 'success', 'candidate has not passed all checks'
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f"ARTIFACT_NAME=ii-windows-windows-native-end4-{run['run_number']}\n")
          PY
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.CANDIDATE_RUN }}
          name: ${{ env.ARTIFACT_NAME }}
          path: candidate
      - name: Install packaging tools
        run: sudo apt-get update -qq && sudo apt-get install -y nsis p7zip-full
      - name: Build the single EXE
        run: python3 packaging/build-single-exe.py candidate out
      - name: Verify bundled payloads match the tested build
        run: |
          7z x out/*.exe -overify
          cmp candidate/ii-windows-setup.exe 'verify/$PLUGINSDIR/ii-windows-setup.exe'
          cmp candidate/ii-windows-*.zip 'verify/$PLUGINSDIR/payload.zip'
          cp candidate.json out/CANDIDATE-RUN.json
      - uses: actions/upload-artifact@v4
        with:
          name: ii-windows-single-exe
          path: out/
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_RUN: ${{ inputs.candidate_run }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ii-windows-single-exe
          path: installer
      - name: Publish the requested tested preview
        working-directory: installer
        run: |
          python - <<'PY'
          import json, os, pathlib, re
          run = json.load(open('CANDIDATE-RUN.json'))
          assert str(run['id']) == os.environ['EXPECTED_RUN']
          assert run['conclusion'] == 'success'
          assert run['head_branch'] == 'windows-native-end4'
          files = list(pathlib.Path('.').glob('*-x64-offline-setup.exe'))
          assert len(files) == 1
          name = files[0].name
          match = re.fullmatch(r'ii-windows-([0-9A-Za-z.+-]+)-x64-offline-setup.exe', name)
          assert match
          version = match[1]
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'RELEASE_TAG=v{version}\nEXE={name}\nCANDIDATE_SHA={run["head_sha"]}\n')
          pathlib.Path('release-notes.md').write_text(
              'Windows x64 development preview. Download the offline setup EXE and open it; no separate package or PowerShell command is required. Uses the existing ii installation and settings.\n\n'
              'This preview routes Windows-style labels and text fields through the selected Qt text renderer, including controls previously hardcoded to native raster rendering. The Honkai theme selects Distance field. Fonts, font sizes, icon rendering and display scaling are unchanged. Windows wallpaper shortcut hints now use Win.\n\n'
              'Select Settings > Interface > Text rendering > Distance field, then fully restart ii and Settings. Use only the base theme Install.ps1; skip the old shell-overwrite glass/text installers.\n\n'
              'This remains an incomplete Windows port. Live Wallpaper Engine refraction is unsupported. Hosted-runner screenshot and font-folder-lock limitations and real-device desktop/DPI testing remain outstanding.\n\n'
              f'Validated candidate: https://github.com/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{run["id"]} (source {run["head_sha"]}). The single-EXE payloads were compared byte-for-byte with that candidate.\n', encoding='utf-8')
          PY
          sha256sum -c *.exe.sha256
          gh release create "$RELEASE_TAG" "$EXE" "$EXE.sha256" \
            --repo "$GITHUB_REPOSITORY" --target "$CANDIDATE_SHA" \
            --prerelease --latest=false --title "end4 Windows preview $RELEASE_TAG" \
            --notes-file release-notes.md
